services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - chroma_data:/app/data/chroma
    healthcheck:
      # Phase 4 must expose GET /api/health → 200 or frontend will never start
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Test runner. Same image as `backend` but built with pytest installed.
  # Not started by `docker compose up` — it sits behind the `test` profile:
  #   docker compose --profile test run --rm backend-test
  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_DEV: "true"
    command: python -m pytest tests/ -v

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chroma_data:
